services:
  db:
    image: postgres:17-alpine
    container_name: sheet-happens-dev-db
    environment:
      POSTGRES_DB: sheet_happens
      POSTGRES_PASSWORD: sheet_happens
      POSTGRES_USER: sheet_happens
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheet_happens -d sheet_happens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sheet_happens_dev_db:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: sheet-happens-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sheet_happens
      MINIO_ROOT_PASSWORD: sheet_happens
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sheet_happens_dev_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until mc alias set local http://minio:9000 sheet_happens sheet_happens; do sleep 1; done; mc mb -p local/sheet-happens-dev || true",
      ]

volumes:
  sheet_happens_dev_db:
  sheet_happens_dev_minio:
