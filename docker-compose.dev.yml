services:
  db:
    image: postgres:17-alpine
    container_name: sheet-happens-dev-db
    environment:
      POSTGRES_DB: sheet_happens
      POSTGRES_PASSWORD: sheet_happens
      POSTGRES_USER: sheet_happens
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheet_happens -d sheet_happens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sheet_happens_dev_db:/var/lib/postgresql/data

volumes:
  sheet_happens_dev_db:
