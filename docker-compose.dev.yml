services:
  db:
    image: postgres:18-alpine
    container_name: sheet-happens-dev-db
    environment:
      POSTGRES_DB: sheet_happens
      POSTGRES_PASSWORD: sheet_happens
      POSTGRES_USER: sheet_happens
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheet_happens -d sheet_happens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory
      # (PGDATA=/var/lib/postgresql/18/docker), so the mount goes one level up.
      - sheet_happens_dev_db:/var/lib/postgresql

  # `pgsty/*` because MinIO withdrew its own images (`minio/minio` and `minio/mc` no longer exist
  # on Docker Hub or quay.io). Same server, same flags; the same release CI starts.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: sheet-happens-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sheet_happens
      MINIO_ROOT_PASSWORD: sheet_happens
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sheet_happens_dev_minio:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until mc alias set local http://minio:9000 sheet_happens sheet_happens; do sleep 1; done; mc mb -p local/sheet-happens-dev || true",
      ]

volumes:
  sheet_happens_dev_db:
  sheet_happens_dev_minio:
