      - listitem:
        - text: Internal Ops & Tooling
        - paragraph: Internal dashboard updates
        - text: /\d+\.\d+ h/
        - button "Edit Internal dashboard updates"
        - button "Delete Internal dashboard updates"
      - listitem:
        - text: Atlas Platform
        - paragraph: Code review
        - text: /\d+\.\d+ h/
        - button "Edit Code review"
        - button "Delete Code review"
    - button "Add entry on Monday"
