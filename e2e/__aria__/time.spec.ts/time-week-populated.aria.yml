- main:
  - radiogroup "Detail level":
    - radio "Day"
    - radio "Week" [checked]
    - radio "Grid"
    - radio "Month"
  - text: 1-4 level · − + step · [ ] week · t today
  - button "New timer"
  - button "New entry"
  - button "Previous week"
  - text: /\w+ \d+ - \w+ \d+, \d{4}/
  - button "Next week"
  - text: /This week Week total \d+ h/
  - button "Same as yesterday"
  - button "Duplicate last week"
  - text: Assigned Atlas Platform Internal Ops & Tooling Recent
  - button "Atlas Platform"
  - button "Internal Ops & Tooling"
  - group "Days of this week":
    - button "Select Monday": /Mon \d+/
    - button "Select Tuesday": /Tue \d+/
    - button "Select Wednesday": /Wed \d+/
    - button "Select Thursday": /Thu \d+/
    - button "Select Friday": /Fri \d+/
    - button "Select Saturday": /Sat \d+/
    - button "Select Sunday": /Sun \d+/
  - text: /Day total \d+(\.\d+)? h/
  - paragraph:
    - text: one time test is declared monthly —
    - button "see Month"
  - region "Monday":
    - heading "Open Monday" [level=2]:
      - button "Open Monday": /Mon \d+ 8\.5 h/
